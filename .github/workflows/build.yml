name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# JUCE and zqsfx_ui are fetched by CMake (FetchContent, pinned tags); no submodules.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxfixes-dev libxinerama-dev libxrandr-dev \
            libxrender-dev libgl-dev libwebkit2gtk-4.1-dev libgtk-3-dev libcurl4-openssl-dev xvfb

      - name: Configure
        working-directory: ChordFoundry
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        working-directory: ChordFoundry
        run: cmake --build build --config Release --parallel

      - name: Test
        working-directory: ChordFoundry
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Verify universal binary and macOS 11.0 minimum (macOS)
        if: runner.os == 'macOS'
        working-directory: ChordFoundry
        run: |
          BIN="build/bin/Chord Foundry.app/Contents/MacOS/Chord Foundry"
          echo "$(lipo -archs "$BIN"), minimum macOS $(otool -l "$BIN" | awk '/minos/{print $2}' | sort -u | tr '\n' ' ')"
          lipo -archs "$BIN" | grep -q arm64 && lipo -archs "$BIN" | grep -q x86_64
          test "$(otool -l "$BIN" | awk '/minos/{print $2}' | sort -u)" = "11.0"

      - name: Upload app (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ChordFoundry-macOS
          path: ChordFoundry/build/bin/Chord Foundry.app
          if-no-files-found: error

      - name: Upload app (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ChordFoundry-Windows
          path: ChordFoundry/build/bin/Release/*.exe
          if-no-files-found: error

      - name: Upload app (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ChordFoundry-Linux
          path: ChordFoundry/build/bin/Chord Foundry
          if-no-files-found: error
