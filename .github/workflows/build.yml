name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# JUCE and zqsfx_ui are fetched by CMake (FetchContent, pinned tags); no submodules.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxfixes-dev libxinerama-dev libxrandr-dev \
            libxrender-dev libgl-dev libwebkit2gtk-4.1-dev libgtk-3-dev libcurl4-openssl-dev xvfb

      - name: Configure
        working-directory: ChordFoundry
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        working-directory: ChordFoundry
        run: cmake --build build --config Release --parallel

      - name: Test
        working-directory: ChordFoundry
        run: ctest --test-dir build -C Release --output-on-failure
